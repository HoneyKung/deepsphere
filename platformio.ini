[platformio]
src_dir = firmware/src
include_dir = firmware/include
boards_dir = firmware/boards
data_dir = firmware/data

; The scene firmware. The bring-up diagnostic below has its own setup()/loop(), so each
; environment names the sources it compiles instead of sweeping firmware/src.
[env:esp32-s3-zero]
build_src_filter = -<*> +<main.cpp> +<math/>
platform = espressif32@6.7.0
board = waveshare_esp32_s3_zero
framework = arduino
monitor_speed = 115200
monitor_filters = direct
; The monitor holds the same modem lines as the dashboard. If the two disagreed, a comparison
; between them would measure the setting rather than the board. DTR high is what makes this
; board's USB CDC stack transmit; RTS stays low because a reset would be driven from it.
; These apply to the monitor only. Upload keeps esptool's own reset sequence, untouched here.
monitor_dtr = 1
monitor_rts = 0
; The S3-Zero flashes over the chip's built-in USB Serial/JTAG, where esptool's jump to
; 460800 baud gets no reply and the upload dies with "No serial data received". Pinning the
; upload speed keeps it at one rate the port actually answers on.
upload_speed = 115200
; The stub loader also stalls on this port, so flash without it.
upload_flags =
  --no-stub
board_build.flash_size = 4MB
board_build.filesystem = littlefs
; default.csv leaves a 1.4MB filesystem partition, which the 1MB atlas needs.
board_build.partitions = default.csv
; ESP32-S3FH4R2 carries 2MB of quad PSRAM, not the octal PSRAM of the R8 parts.
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit ST7735 and ST7789 Library@1.10.4
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -DDEEP_SPHERE_ENV=\"esp32-s3-zero\"
  -I firmware/include
  -I firmware/src

; The host math check does not run here: PlatformIO's native platform needs a system
; compiler this machine does not have. Use tests/native/run_native_test.py instead, which
; builds the same firmware math with the pip-installable zig toolchain.

; Panel bring-up only: five solid-colour panels, 8 MHz SPI, no PSRAM, no atlas, no inputs.
; Flash this first whenever the panels are dark. It answers whether the fault is wiring,
; power or the renderer, and it is the smallest thing that can possibly light the glass.
[env:diag]
build_src_filter = -<*> +<diag/panel_check.cpp>
platform = espressif32@6.7.0
board = waveshare_esp32_s3_zero
framework = arduino
monitor_speed = 115200
monitor_filters = direct
; The monitor holds the same modem lines as the dashboard. If the two disagreed, a comparison
; between them would measure the setting rather than the board. DTR high is what makes this
; board's USB CDC stack transmit; RTS stays low because a reset would be driven from it.
; These apply to the monitor only. Upload keeps esptool's own reset sequence, untouched here.
monitor_dtr = 1
monitor_rts = 0
upload_speed = 115200
upload_flags =
  --no-stub
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit ST7735 and ST7789 Library@1.10.4
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -DDEEP_SPHERE_ENV=\"diag\"
  -I firmware/include
  -I firmware/src

; Live yaw demo: AS5600 only, deliberately excludes the ST7789 renderer and main.cpp.
[env:live-yaw]
build_src_filter = -<*> +<demo_live_yaw.cpp> +<sensors/>
platform = espressif32@6.7.0
board = waveshare_esp32_s3_zero
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
upload_speed = 115200
upload_flags =
  --no-stub
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -DDEEP_SPHERE_ENV=\"live-yaw\"
  -I firmware/include
  -I firmware/src
